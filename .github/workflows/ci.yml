name: ECHO quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: echo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @echo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @echo/web exec playwright test --project=desktop
